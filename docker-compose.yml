services:
  postgres:
    image: postgres:16-alpine
    container_name: jm_p2p_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: juan
      POSTGRES_PASSWORD: juan_dev_password
      POSTGRES_DB: juan_p2p
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juan -d juan_p2p"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jm_p2p_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
